[package]
name = "meridian-solana"
version = "0.1.0"
description = "Meridian cross-chain DeFi router — Solana program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian_solana"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token", "metadata"] }
# Kamino CPI — comment out if not yet published; we stub the interface below
# kamino-lending = { version = "1.0.0", features = ["cpi"] }

[dev-dependencies]
anchor-client = "0.30.1"
