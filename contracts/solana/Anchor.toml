[toolchain]
anchor_version = "0.30.1"
solana_version = "2.0.3"

[features]
resolution = true
skip-lint = false

[programs.localnet]
meridian_solana = "MeridN1sVaULtjEjSNFpRt2g6DpW9ZSP2V3Wy4XfGhw"

[programs.devnet]
meridian_solana = "MeridN1sVaULtjEjSNFpRt2g6DpW9ZSP2V3Wy4XfGhw"

[programs.mainnet-beta]
meridian_solana = "MeridN1sVaULtjEjSNFpRt2g6DpW9ZSP2V3Wy4XfGhw"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = ["programs/*"]
