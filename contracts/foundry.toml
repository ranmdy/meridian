[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
]

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536

[profile.ci.fuzz]
runs = 5000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
sort_imports = true
