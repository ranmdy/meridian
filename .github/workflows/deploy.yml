name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # Never cancel a running deploy

jobs:
  # ─── Gate: only deploy if CI passes ──────────────────────────────────────────
  check-ci:
    name: Verify CI status
    runs-on: ubuntu-latest
    steps:
      - name: Confirm CI workflow passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
            --jq '[.check_runs[] | select(.name | startswith("CI"))] | map(.conclusion) | all(. == "success") | tostring')
          if [[ "$STATUS" != "true" ]]; then
            echo "CI did not pass — blocking deploy"
            exit 1
          fi
          echo "CI passed — proceeding to deploy"

  # ─── Backend → Railway ────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend (Railway)
    needs: check-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service meridian-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health check (retry up to 60s)
        run: |
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.BACKEND_URL }}/health" || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              echo "Backend healthy after $((i * 5))s"
              exit 0
            fi
            echo "Attempt $i: status $STATUS — waiting…"
            sleep 5
          done
          echo "Backend did not come up in time"
          exit 1

  # ─── Frontend → Vercel ────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: deploy-backend     # Ensure backend is live before frontend points at it
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL:               ${{ secrets.BACKEND_URL }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.WC_PROJECT_ID }}
          NEXT_PUBLIC_ALCHEMY_API_KEY:       ${{ secrets.ALCHEMY_API_KEY }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

  # ─── Notify Slack on failure ──────────────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Post to Slack
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":red_circle: *Meridian deploy failed* on `${{ github.ref_name }}`\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
