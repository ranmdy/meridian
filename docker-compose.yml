version: "3.9"

# ─── Meridian staging stack ───────────────────────────────────────────────────
# Usage:
#   cp .env.example .env          # fill in secrets
#   docker compose up --build -d
#
# Services:
#   postgres  — PostgreSQL 16 (port 5432)
#   redis     — Redis 7 (port 6379)
#   backend   — Fastify API (port 4000)

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian_dev}
      POSTGRES_DB: meridian
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # Chain RPC URLs (set in .env)
      ETH_RPC_URL: ${ETH_RPC_URL:-}
      ETH_RPC_URL_FALLBACK: ${ETH_RPC_URL_FALLBACK:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      BASE_RPC_URL_FALLBACK: ${BASE_RPC_URL_FALLBACK:-}
      ARB_RPC_URL: ${ARB_RPC_URL:-}
      ARB_RPC_URL_FALLBACK: ${ARB_RPC_URL_FALLBACK:-}
      BNB_RPC_URL: ${BNB_RPC_URL:-}
      POLY_RPC_URL: ${POLY_RPC_URL:-}
      OPT_RPC_URL: ${OPT_RPC_URL:-}
      AVAX_RPC_URL: ${AVAX_RPC_URL:-}
      SCROLL_RPC_URL: ${SCROLL_RPC_URL:-}
      ZKSYNC_RPC_URL: ${ZKSYNC_RPC_URL:-}

      # Integrations (set in .env)
      TENDERLY_ACCESS_KEY: ${TENDERLY_ACCESS_KEY:-}
      TENDERLY_PROJECT: ${TENDERLY_PROJECT:-}
      TENDERLY_ACCOUNT: ${TENDERLY_ACCOUNT:-}
      SUBGRAPH_URL: ${SUBGRAPH_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
  redis_data:
